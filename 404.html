  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      box-sizing: border-box;
    }
    .not-found__mark {
      width: 96px;
      height: 96px;
      margin-bottom: 32px;
    }
    .not-found__code {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: clamp(72px, 14vw, 144px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 0 0 16px;
      color: var(--md-sys-color-on-surface, #1a1c1e);
    }
    .not-found__title {
      font-family: "Fraunces", serif;
      font-weight: 500;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.4;
      margin: 0 0 40px;
      color: var(--md-sys-color-on-surface-variant, #44474e);
      max-width: 480px;
    }
    .not-found__link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      color: var(--sky-50, #0A7AFF);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
    }
    .not-found__link:hover {
      opacity: 0.8;
    }
    .invite {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      box-sizing: border-box;
    }
    .invite__mark { width: 88px; height: 88px; margin-bottom: 28px; }
    .invite__title {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      color: var(--md-sys-color-on-surface, #1a1c1e);
    }
    .invite__subtitle {
      font-size: clamp(16px, 2.2vw, 19px);
      line-height: 1.5;
      margin: 0 0 32px;
      color: var(--md-sys-color-on-surface-variant, #44474e);
      max-width: 420px;
    }
    .invite__actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .invite__note {
      font-size: 15px;
      color: var(--md-sys-color-on-surface-variant, #44474e);
      margin: 0;
    }
    .invite__hint {
      font-size: 14px;
      line-height: 1.5;
      color: var(--md-sys-color-on-surface-variant, #44474e);
      max-width: 360px;
      margin: 20px 0 0;
    }
    .invite__back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      font-size: 16px;
      color: var(--sky-50, #0A7AFF);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
    }
    .invite__back:hover { opacity: 0.8; }

  <main class="not-found" id="notFound">

    <p class="not-found__title">This page seems to have drifted off somewhere.</p>

  <main class="invite" id="invite" hidden>
    <svg class="invite__mark" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nubecita cloud">

        <path d="M 38 22 q 3 -3 6 0" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>

    <p class="invite__subtitle" id="inviteSubtitle"></p>
    <div class="invite__actions">
      <a id="actOpenApp" class="btn btn--filled" hidden>Open in Nubecita</a>
      <a id="actBluesky" class="btn btn--filled" rel="noopener" hidden>View on Bluesky Web</a>
      <a id="actPlay" class="play-badge" href="https://play.google.com/store/apps/details?id=net.kikin.nubecita" rel="noopener" hidden>

    </div>
    <p class="invite__hint" id="inviteHint" hidden>Nothing happening? Tap the &vellip; menu and choose &ldquo;Open in browser&rdquo; (Chrome).</p>
